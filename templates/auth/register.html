<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VulnEx | Register</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
    font-family:Inter,sans-serif;
    background:#050816;
    color:white;
    overflow-x:hidden;
    overflow-y:auto;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);
    background-size:42px 42px;
}

.glow{
    position:absolute;
    left:50%;
    top:-250px;
    transform:translateX(-50%);
    width:950px;
    height:950px;
    border-radius:999px;
    background:radial-gradient(circle,rgba(124,58,237,.28),transparent 65%);
    filter:blur(25px);
}

.card{
    background:rgba(15,23,42,.78);
    backdrop-filter:blur(18px);
    border:1px solid #1E293B;
    box-shadow:
    0 0 25px rgba(34,211,238,.05),
    0 0 60px rgba(124,58,237,.08);
}

.card:hover{
    border-color:#22D3EE;
    box-shadow:
    0 0 25px rgba(34,211,238,.15),
    0 0 70px rgba(124,58,237,.18);
}

input{
    background:#131C31;
    border:1px solid #1E293B;
    color:white;
    transition:.3s;
}

input:focus{
    outline:none;
    border-color:#22D3EE;
    box-shadow:0 0 20px rgba(34,211,238,.25);
}

.msg{
    background:rgba(239,68,68,.15);
    border:1px solid rgba(239,68,68,.5);
    color:#fecaca;
    padding:12px;
    border-radius:12px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="grid"></div>
<div class="glow"></div>

<!-- Navbar -->

<nav class="fixed top-0 left-0 right-0 h-16 flex items-center justify-between px-10 border-b border-slate-800 bg-black/20 backdrop-blur">

<div class="text-2xl font-bold" style="font-family:'Space Grotesk'">

Vuln<span class="text-cyan-400">Ex</span>

</div>

<a href="{% url 'home' %}"

class="px-5 py-2 rounded-lg bg-cyan-400 text-black font-semibold hover:bg-cyan-300 transition">

← Home

</a>

</nav>

<div class="min-h-screen flex items-center justify-center pt-20 p-8">

<div class="card rounded-3xl p-10 w-full max-w-lg">

<div class="inline-flex items-center gap-2 bg-cyan-400/10 border border-cyan-400/20 rounded-full px-4 py-2 mb-6">

<span class="text-cyan-400 text-sm font-semibold">

Create Your Account

</span>

</div>

<h2 class="text-4xl font-bold mb-3" style="font-family:'Space Grotesk'">

Register

</h2>

<p class="text-slate-400 mb-8">

Create your VulnEx account to start scanning websites.

</p>

{% if messages %}
{% for message in messages %}

<div class="msg">

{{ message }}

</div>

{% endfor %}
{% endif %}

<form method="POST" id="registerForm" class="space-y-5">

{% csrf_token %}

<div>

<label class="block mb-2 text-sm">

Full Name

</label>

<input
type="text"
name="full_name"
placeholder="John Doe"
class="w-full rounded-xl px-4 py-3"
required>

</div>

<div>

<label class="block mb-2 text-sm">

Email Address

</label>

<input
type="email"
name="email"
placeholder="john@example.com"
class="w-full rounded-xl px-4 py-3"
required>

</div>


<div>

<label class="block mb-2 text-sm">
Mobile Number
</label>

<input
type="text"
id="mobile_number"
name="mobile_number"
placeholder="+919876543210"
class="w-full rounded-xl px-4 py-3"
required>

<button
type="button"
id="sendOtpBtn"
class="mt-3 w-full rounded-xl bg-blue-600 py-3 font-semibold hover:bg-blue-500 transition">

Send OTP

</button>

</div>

<div>

<label class="block mb-2 text-sm">
Enter OTP
</label>

<input
type="text"
id="otp"
placeholder="Enter OTP"
class="w-full rounded-xl px-4 py-3">

<button
type="button"
id="verifyOtpBtn"
class="mt-3 w-full rounded-xl bg-green-600 py-3 font-semibold hover:bg-green-500 transition">

Verify OTP

</button>

<p id="otpStatus" class="mt-3 hidden">

OTP not verified

</p>

</div>

<input
type="hidden"
name="otp_verified"
id="otp_verified"
value="false">


<div>
<label class="block mb-2 text-sm">

Password

</label>

<input
type="password"
name="password"
class="w-full rounded-xl px-4 py-3"
required>

</div>

<div>

<label class="block mb-2 text-sm">

Confirm Password

</label>

<input
type="password"
name="confirm_password"
class="w-full rounded-xl px-4 py-3"
required>

</div>

<button
type="submit"
id="registerBtn"
disabled
class="w-full rounded-xl bg-cyan-400 text-black font-semibold py-3 opacity-50 cursor-not-allowed transition-all duration-300">

Create Account

</button>

<div class="flex items-center gap-4">

<div class="flex-1 h-px bg-slate-700"></div>

<span class="text-slate-500 text-sm">

OR

</span>

<div class="flex-1 h-px bg-slate-700"></div>

</div>

<p class="text-center text-slate-400">

Already have an account?

<a href="{% url 'login' %}"

class="text-cyan-400 font-semibold hover:text-cyan-300">

Login

</a>

</p>

</form>

</div>

</div>


<script>

const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

document.getElementById("sendOtpBtn").addEventListener("click", async () => {

    let mobile = document.getElementById("mobile_number").value.trim();

mobile = mobile.replace("+91", "").replace(/\s/g, "");

if (!/^[6-9]\d{9}$/.test(mobile)) {
    alert("Enter a valid Indian mobile number.");
    return;
}

    const formData = new FormData();
    formData.append("mobile", mobile);

    const response = await fetch("{% url 'send_otp' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken
        },
        body: formData
    });

    const data = await response.json();

    if (data.Status === "Success") {

        document.getElementById("otpStatus").classList.remove("hidden");
        document.getElementById("otpStatus").innerHTML =
            "<span style='color:lime'>OTP Sent Successfully</span>";

    } else {

        alert("Failed to send OTP");
        console.log(data);

    }

});


document.getElementById("verifyOtpBtn").addEventListener("click", async () => {

    const otp = document.getElementById("otp").value.trim();

    if (otp === "") {
        alert("Enter OTP");
        return;
    }

    const formData = new FormData();
    formData.append("otp", otp);

    const response = await fetch("{% url 'verify_otp' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken
        },
        body: formData
    });

    const data = await response.json();

    if (data.Status === "Success") {

        document.getElementById("otp_verified").value = "true";

        document.getElementById("otpStatus").innerHTML =
            "<span style='color:lime'>✔ Mobile Number Verified</span>";

        const btn = document.getElementById("registerBtn");

        btn.disabled = false;
        btn.classList.remove("opacity-50", "cursor-not-allowed");

    } else {

        alert("Invalid OTP");
        console.log(data);

    }

});

</script>

</body>

</html>
